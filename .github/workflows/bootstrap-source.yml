name: Publish complete Mosaic HN source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.tar.xz.b64.part-* > /tmp/mosaic-source.tar.xz.b64
          base64 --decode /tmp/mosaic-source.tar.xz.b64 > /tmp/mosaic-source.tar.xz
          echo "a9d051f0256333406248919b48c53006ddd453756de48a8b83443c2dbcab604d  /tmp/mosaic-source.tar.xz" | sha256sum -c -

      - name: Extract and verify complete handoff
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/mosaic-source.tar.xz -C "$GITHUB_WORKSPACE"
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f package.json
          test -f docs/handoff/CONVERSATION_CONTEXT.md
          test -f docs/handoff/NEXT_AGENT_TASKS.md
          test -f .github/workflows/quality.yml
          npm test
          npm run validate:themes
          npm run verify:source

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          # Keep this bootstrap workflow unchanged during the Actions push.
          # The quality workflow is added immediately afterward through the
          # authenticated GitHub connector, avoiding workflow-token restrictions.
          mv .github/workflows/quality.yml /tmp/mosaic-quality.yml
          rm -rf bootstrap
          file_count="$(find . -path './.git' -prune -o -type f -print | wc -l | tr -d ' ')"
          test "$file_count" -eq 177
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No source changes staged'; exit 1; }
          git commit -m "feat: publish complete Mosaic HN source"
          git push origin HEAD:main
