name: Expand complete Mosaic HN source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          parts=(bootstrap/source.tar.gz.b64.part-*)
          if (( ${#parts[@]} == 0 )); then
            echo "No source archive parts found" >&2
            exit 1
          fi

          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/mosaic-hn-source.tar.gz
          gzip -t /tmp/mosaic-hn-source.tar.gz

          rm -rf /tmp/mosaic-hn-source
          mkdir -p /tmp/mosaic-hn-source
          tar -xzf /tmp/mosaic-hn-source.tar.gz -C /tmp/mosaic-hn-source

          source_root=/tmp/mosaic-hn-source
          mapfile -t top_entries < <(find "$source_root" -mindepth 1 -maxdepth 1 -print)
          if (( ${#top_entries[@]} == 1 )) && [[ -d "${top_entries[0]}" ]]; then
            source_root="${top_entries[0]}"
          fi

          test -f "$source_root/package.json"
          test -f "$source_root/AGENTS.md"
          test -f "$source_root/README.md"
          test -d "$source_root/src"
          test -d "$source_root/app"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/bootstrap-source.yml' \
            "$source_root"/ ./

          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Verify expanded project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f README.md
          test -f LICENSE
          test -f app.config.ts
          test -f eas.json
          test -f .github/workflows/quality.yml
          test -d app
          test -d src
          test -d module-sdk
          test -d theme-sdk
          test -d docs
          test -d tests

          file_count=$(find . -path './.git' -prune -o -type f -print | wc -l)
          echo "Expanded file count: $file_count"
          if (( file_count < 170 )); then
            echo "Expected at least 170 project files" >&2
            exit 1
          fi

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: publish complete Mosaic HN source"
          git push origin HEAD:main
