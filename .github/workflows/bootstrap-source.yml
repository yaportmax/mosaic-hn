name: Expand complete Mosaic HN source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/payload/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode and verify complete source payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          parts=(bootstrap/payload/source.tar.gz.b64.part-*)
          test "${#parts[@]}" -eq 11
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/mosaic-hn-source.tar.gz
          echo "405e08d14382a0e051e779b36a7083fcac778f2e14122067301609f825dd12de  /tmp/mosaic-hn-source.tar.gz" | sha256sum -c -
          gzip -t /tmp/mosaic-hn-source.tar.gz

          rm -rf /tmp/mosaic-hn-source
          mkdir -p /tmp/mosaic-hn-source
          tar -xzf /tmp/mosaic-hn-source.tar.gz -C /tmp/mosaic-hn-source
          source_root=/tmp/mosaic-hn-source

          file_count=$(find "$source_root" -type f -print | wc -l | tr -d ' ')
          echo "Payload file count: $file_count"
          test "$file_count" -eq 177
          test -f "$source_root/package.json"
          test -f "$source_root/AGENTS.md"
          test -f "$source_root/CLAUDE.md"
          test -f "$source_root/docs/handoff/NEXT_AGENT_TASKS.md"
          test -f "$source_root/.github/workflows/quality.yml"

          git -C "$source_root" init -q
          git -C "$source_root" config core.filemode true
          git -C "$source_root" add -A -f
          actual_tree=$(git -C "$source_root" write-tree)
          expected_tree=2b335c0c428ff60cfd8f20458d52583bf2041c2e
          echo "Payload Git tree: $actual_tree"
          test "$actual_tree" = "$expected_tree"
          rm -rf "$source_root/.git"

      - name: Replace bootstrap repository with source tree
        shell: bash
        run: |
          set -euo pipefail
          source_root=/tmp/mosaic-hn-source
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$source_root"/ ./
          rm -rf bootstrap
          rm -f upload-status.txt trigger-source-expansion.txt trigger-source-bootstrap.txt

          test -f package.json
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f README.md
          test -f LICENSE
          test -f app.config.ts
          test -f eas.json
          test -d app
          test -d src
          test -d module-sdk
          test -d theme-sdk
          test -d docs

      - name: Commit expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No source changes staged" >&2; exit 1; }
          git commit -m "feat: publish complete Mosaic HN source"
          git push origin HEAD:main
